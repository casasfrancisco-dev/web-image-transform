<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-ESRGAN Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 25px; }
        img, canvas { max-width: 100%; height: auto; }
        .images { display: flex; gap: 30px; flex-wrap: wrap; }
        .images > div { flex: 1; min-width: 280px; }
        button { margin: 15px 0; padding: 10px 18px; }
    </style>
</head>
<body>
    <h1>Image Transform</h1>
    <h2>Real-ESRGAN - ONNX Runtime Web</h2>

    <input type="file" id="imageInput" accept="image/*">

    <br>
    <button id="processButton" disabled>
        Procesar imagen
    </button>

    <p id="status">Selecciona una imagen.</p>

    <div class="images">
        <div>
            <h3>Original</h3>
            <img id="originalImage">
        </div>

        <div>
            <h3>Resultado</h3>
            <canvas id="resultCanvas"></canvas>
            <br>
            <button id="downloadButton" disabled>
                Descargar resultado
            </button>
        </div>
    </div>

    <script type="module" src="real-esrgan-test.js"></script>
</body>
</html>
